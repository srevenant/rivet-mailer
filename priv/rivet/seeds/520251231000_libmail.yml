type: Rivet.Mailer.Template
values:
  id: 8917541C-8332-42C1-99E9-82DDC2C23EBF
  name: Elixir.Core.Mailer.Template.User.LibreonMail
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Message Received
    === body
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
      </head>
      <body>
        <div style="line-height:1.5">
          <p>You have received a <a href="<%= @links.contact %>"><%= @site.name %> message:</a></p>

          <table><tbody>
          <tr><th>From:</th><td><%= @author.name %> (<%= @author.handle %>)</td></tr>
          <tr><th>Message:</th><td><%= @message %></td></tr>
          </tbody></table>

          <p>Note: You can disable automatic LibMail updates in your Preferences->Contact settings</p>
          <p><%= @site.footer %></p>
        </div>
      </body>
    </html>
