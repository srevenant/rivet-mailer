---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @admin.name %> has invited you to join "<%= @invite.to %>" at <%= @site.name %>
    === body
    <p><%= @admin.name %> has invited you to join "<%= @invite.to %>" as <%= @access %><%= @roles %>.

    <p>You can accept this invitation by visiting <a href="<%= @invite.link %>"><%= @site.name %> - <%= @invite.to %> - ACCEPT</a>, or copying the link:

    <p><blockquote>
    <%= @invite.link %>
    </blockquote>

    <p><%= @site.footer %>
  id: c033d498-dccb-4bcb-9510-9b207c2dd4ba
  name: Elixir.Core.Mailer.Template.Invite.RequestJoin

---
type: Rivet.Mailer.Template
values:
  id: 86de3f08-33bc-4cd8-9745-cf2aa2e211eb
  name: Elixir.Core.Mailer.Template.ContactUs.ToRequestor
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Message Received
    === body
    <style type="text/css">
    th { text-align: right }
    </style>
    We've received your message (shown below) Thank you!
    <p><p>
    <table><tbody>
    <%= for [k, v] <- @fields do %>
    <tr><th><b><%= Rivet.Utils.English.titleize("#{k}") %>:</b></th><td><%= v %></td></tr>
    <% end %>
    </tbody></table>
    <p>
    <%= @site.footer %>

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Contact Us Form Received
    === body
    <style type="text/css">
    th { text-align: right }
    </style>
    Sales Message Submitted
    <p>
    <i><b style="color: #f44">NOTE: This is sent by Libreon's Form System, it is not sent directly by the user</b></i>
    <p>This can cause some confusion with systems detecting content as unsolicited email. Be cautious flagging it as a problem as this will actually impact our internal systems automation.
    <p>
    <br>
    <table><tbody>
    <%= for [k, v] <- @fields do %>
    <tr><th style="padding: 0.25em"><b><%= Rivet.Utils.Title.titleize("#{k}") %>:</b></th><td style="padding: 0.25em"><%= v %></td></tr>
    <% end %>
    </tbody></table>
  id: 7da20d21-c4ee-40b7-a64a-d1afe8d88bd3
  name: Elixir.Core.Mailer.Template.ContactUs.ToSales

