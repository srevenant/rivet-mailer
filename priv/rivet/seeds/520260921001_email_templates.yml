type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> User Change Failed
    === body
    <p>We recently received a request to <%= @action %>, but it was unsuccessful.

    <p>If you did not request this change, you can ignore this email and nothing will change.

    <p><b>PLEASE NOTE:</b> Libreon, Revenant Creative Studio, and Roguetrader all share the same backend (Libreon), as such your account is the same across all of these sites. Changes to one changes it on all.

    <p><%= @site.footer %>
  id: 9628698f-e2be-4995-8cfe-fad2d5965322
  name: Elixir.Core.Mailer.Template.User.FailedChange

