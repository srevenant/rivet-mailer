type: Rivet.Mailer.Template
values:
  id: EF5B5CD1-FC35-4A6A-AA27-ADDAAF361B7E
  name: Elixir.Core.Mailer.Template.Revenant.Subscribe
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    Subscribed to new releases
    === body
    Hello,

    We received a request to subscribe to new release emails. If this is not
    desired, you can reverse your subscription by visiting: <a href="<%= @links.subs %>">Manage Subscriptions.</a>)

    <p><%= @site.footer %>
