type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Password Reset
    === body
    <% link = "#{@links.pwreset}/#{@code}" %>

    <p>We recently received a request to reset a password for your account at <%= @site.name %>. If you initiated this request, you can reset your password with this one-time-use code by clicking the Reset Password link:

    <p><a href="<%= link %>">Reset Password</a>

    <p>If you are unable to view or click the link in this message, copy the following URL and paste it in your browser:

    <p><code><%= link %></code>

    <p>This code will expire in <%= @expires %>.

    <p>If you did not request this change, you can ignore this email and your password will not be changed.

    <p><b>PLEASE NOTE:</b> Libreon, Revenant Creative Studio, and Roguetrader all share the same backend (Libreon), as such your account is the same across all of these sites. Changes to one changes it on all.


    <p><%= @site.footer %>
  id: aeb3ccca-857e-442f-ba27-577efdc4fabd
  name: Elixir.Core.Mailer.Template.User.PasswordReset

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Email Verification
    === body
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
      </head>
      <body>
        <div style="line-height:1.5">
          <p>We received a request to verify an email address at <b>Libreon.net</b>. This helps us finish setting up your account and enable all features. If this wasn’t you, you can safely ignore this message.</p>
          <p><b>To verify your email address, simply reply to this email.</b></p>
          <p>You don’t need to type or change anything — just send the reply as-is.</p>
          <p>This code will expire in <%= @expires %>.
          <blockquote>
          <strong>Verification code:</strong>
          <p><code>LCODE: <%= @code %></code></p>
          </blockquote>
          <p><%= @site.footer %></p>
        </div>
      </body>
    </html>
  id: a70bc19d-d41f-4c1d-937f-db4cf0b3945c
  name: Elixir.Core.Mailer.Template.User.Verification

