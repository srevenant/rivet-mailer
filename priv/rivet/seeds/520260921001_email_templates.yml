  name: Elixir.Core.Mailer.Template.Invite.MemberAsk

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    [<%= @site.name %>] Answer Submitted (<%= @project.title %>) <%= @answer.input.label %>
    === body
    <h1>Answer Submitted</h1>
    <style>
    .thl { text-align: right; font-weight: bold }
    </style>
    <table><tbody>
    <tr><td class="thl">Title:</td><td><a href="<%= @links.project %>"><%= @project.title %></a></td></tr>
    <tr><td class="thl">Mentor Answer:</td><td><a href="<%= @links.mentor_answer %>"><%= @answer.input.label %></td></tr>
    <tr><td class="thl">Journey Answer:</td><td><a href="<%= @links.journey_answer %>"><%= @answer.input.label %></td></tr>
    <tr><td class="thl">User:</td><td><a href="<%= @links.actor %>"><%= @actor.name %> (<%= @actor.handle %>)</a></td></tr>
    </tbody></table>
  id: b79d4d28-2dc4-40b6-a248-f8771c5561c2
  name: Elixir.Core.Mailer.Template.Learn.AnswerReady

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    [<%= @site.name %>] You’ve received new feedback on: <%= @project.title %>
    === body
    You have received feedback in your journey submission on: <a href="<%= @links.journey %>"><%= @project.title %></a>.
    <p>

    You can review this feedback on your title's journey page: <a href="<%= @links.journey %>"><%= @links.journey %></a>.
    <p>

    Or, if you prefer not to click links in email, go to Manage → Journeys in Libreon and pick up where you left off.
    <p>

    Take a look and keep your momentum going — every round of feedback is a step closer to the next milestone.
    <p>

    Thanks for being part of the Libreon community!

    <%= @site.footer %>
  id: 29cddd7b-ed76-48d9-aa70-c274fb39bd60
  name: Elixir.Core.Mailer.Template.Learn.MentorFeedback

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    From the world of Atom Bomb Baby: God's Gonna Cut You Down
    === body
    A new Riders of the Stars novel, now available for pre-order.
    <p>
    I’m excited to share that my next book in the series, <b>God's Gonna Cut You Down</b>, is now available for pre-order where books are sold.
    <p>
    <blockquote>
    “Gripping dystopian tale [...] exploring survival, humanity, and self-acceptance.” — <i>Booklife by Publishers Weekly</i>
    <p>
    “A compelling SF survival saga.” — <i>Kirkus Reviews</i>
    </blockquote>
    <p>
    I know many of you have been waiting for the next volume after <i>Atom Bomb Baby</i>. <i>God's Gonna Cut You Down</i> isn’t that direct continuation—it’s a story that runs alongside it, beginning even before ABB. While Ashe, Jade, and their friends don’t appear here, this book lays the groundwork for what’s coming next in <i>Catch a Falling Star</i>, planned for early to mid next year.
    <p>
    I’ll admit, <i>God's Gonna Cut You Down</i> came about by accident. While I was developing <i>Catch a Falling Star</i>, the backstory for a new character took on a life of its own—and became a full novel.
    <p>
    <a href="https://ridersofthestars.com/#ggcyd">
    Read more or pre-order now from the Riders of the Stars website.
    </a>
    <p>
    Thank you for your support, it means a lot.
    <p>
    <i>— Brandon Gillespie</i>

    <p>If you have any questions, please visit the <a href="https://revenant.studio/social/">Libreon and Revenant Studio chat server (discord)</a>.

    <p style="font-size: smaller">
    (You’re receiving this email because you expressed interest in receiving updates on new releases. You can update your email preferences by visiting: <a href="<%= @links.subs %>">Manage Subscriptions.</a>)
    </p>
  id: d6814803-6f28-4f6c-a0b6-f64a9625bc89
  name: Elixir.Core.Mailer.Template.Revenant.NewRelease

---
type: Rivet.Mailer.Template
values:
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    Thanks for stopping by at <%= @event %>! Let’s stay connected
    === body
    Thank you so much for stopping by my booth at <%= @event %>! It was wonderful meeting you and hearing your excitement about the <i>Riders of the Stars</i> series and the creative community we’re building together with Libreon.

    <p>You’re receiving this email because you expressed interest in updates from me. Welcome aboard, and sorry for the delay in getting this processed!

    <p>You can review or update your email preferences anytime by visiting: <a href="<%= @links.subs %>">Manage Subscriptions</a>.

    <h2>Your current email preferences:</h2>

    <ul>
    <%= for {pref, value} <- @prefs do %>
      <li><b><%= pref %>:</b> <%= value %>
    <% end %>
    </ul>

    If you’d like to connect or have any questions, come hang out with us on the <a href="https://revenant.studio/social/">Libreon Chat Server (discord)</a>.

    <p>- Brandon Gillespie
  id: 1cab647e-5115-4ee3-a6a2-eb446f71a465
  name: Elixir.Core.Mailer.Template.Revenant.Signup

