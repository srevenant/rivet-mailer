# https://RidersOfTheStars.com/b01/abb-7.1-preview.epub">Atom Bomb Baby Preview</a>
type: Rivet.Mailer.Template
values:
  id: 1cab647e-5115-4ee3-a6a2-eb446f71a465
  name: Elixir.Core.Mailer.Template.Revenant.Signup
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @event %> <%= if @epub.send do %><%= @epub.name %><% else %><%= @site.name %><% end %> followup
    === body
    <%= if @recip[:hello] do %><%= @recip.hello %>,<% end %>
    <p>
    Thank you so much for stopping by our booth at <%= @event %>! It was a pleasure meeting everyone and hearing your excitement about my stories!

    <%= if @casting do %>
    <h2>Casting Call</h2>

    <p>You’ve expressed interest in the Casting Call for the Atom Bomb Baby Book Trailer, and I’m thrilled to have you onboard! See the <a href="https://ridersofthestars.com/news/2024-09-23-fanx-casting-call/">Casting Call</a> for more details.

    <p>If you're still interested in participating, please reach out to me via Discord or email at brandon@cold.org. Since I’m unsure if my previous email made it out properly, a quick confirmation that you're still interested would be much appreciated!

    <% end %>
    <%= if @epub.send do %>
    <h2>Complimentary ePub: First Two Acts of Atom Bomb Baby</h2>

    <p>You can download your complimentary ePub <a href="<%= @epub.link %>"><%= @epub.name %> Preview</a>

    <p>Feel free to share this preview with anyone who might enjoy it!

    <p>While most ebook readers support ePub without hassle, Kindle users should use the <a href="https://www.amazon.com/sendtokindle">Send to Kindle</a> service to get it loaded.

    <h2>Help Spread the Word</h2>

    <p>If you enjoy the preview, there are two meaningful ways to support the Atom Bomb Baby series:

    <ul>
    <li><b>Leave a Review:</b> Reviews and ratings are essential for new authors. A quick star rating or a review on Amazon or your preferred review platform would mean the world to us!

    <li><b>Share with Friends:</b> Word-of-mouth is powerful! Recommending Atom Bomb Baby to your friends or sharing your thoughts on social media helps us reach more readers.
    </ul>

    <p>Your support means everything to me.

    <% end %>
    <h2>Email Preferences</h2>

    <p>Your email preferences:

    <ul>
    <%= for {pref, value} <- @prefs do %>
      <li><b><%= pref %>:</b> <%= value %>
    <% end %>
    </ul>

    <% link = @site.link_app <> @links.subs %><p>You’re receiving this email because you requested updates from Revenant Creative Studio and Brandon Gillespie at <%= @event %>. To update your preferences or unsubscribe, please visit: <a href="<%= link %>">Manage Subscriptions</a>.

