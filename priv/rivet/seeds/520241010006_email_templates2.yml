type: Rivet.Mailer.Template
values:
  id: 599BFAB5-40D3-44AF-9446-D7E002211166
  name: Elixir.Core.Mailer.Template.Invite.MemberAsk
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Access Request
    === body
    <%= @recip.hello %>,
    <p>The following request has been made to "<%= @thing.name %>" at <%= @site.name %>, which you manage:

    <p><blockquote>
    <%= @manage %>
    <div class="border: solid 1px gray; padding: 0.5rem;"><%= @note %></div>
    </blockquote>

    <p>You can go to <a href="<%= @site.link_app %><%= @thing.link %>/edit"><%= @site.name %> - <%= @thing.name %> - access management</a> to approve or deny this request.

    <p><%= @site.footer %>

