type: Rivet.Mailer.Template
values:
  id: 2B35689C-9B28-4397-BE4E-DAFA1118F18A
  name: Elixir.Core.Mailer.Template.User.AccountDelete
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> User Account Delete
    === body
    <% link = "#{@site.link_app}#{@links.delete}/#{@code}" %>
    <p>PLEASE NOTE: Libreon, Revenant Creative Studio, and Roguetrader all share the same backend (Codex), as such your account is the same across all of these sites. Deleting from one will delete it from all!

    <p>We recently received a request to delete your account '<%= @recip.handle %>'. This is PERMANENT, there is no going back, so be certain.

    <p>If you initiated this request, you can complete the process by clicking the link:

    <p><a href="<%= link %>">Delete Account</a>

    <p>This delete code will expire in <%= @expires %>.

    <p>If you did not initiate this request, you can ignore this email and your account will not be deleted.

    <p><%= @site.footer %>


