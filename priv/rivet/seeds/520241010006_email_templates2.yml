type: Rivet.Mailer.Template
values:
  id: C033D498-DCCB-4BCB-9510-9B207C2DD4BA
  name: Elixir.Core.Mailer.Template.Invite.RequestJoin
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @admin.name %> has invited you to join "<%= @thing.name %>" at <%= @site.name %>
    === body
    <% link = "#{@site.link_app}#{@thing.invite}" %>
    <%= if @recip[:hello] do %><%= @recip.hello %>,<% end %>
    <p><%= @admin.name %> has invited you to join "<%= @thing.name %>" as <%= @access %><%= @roles %>.

    <p>You can accept this invitation by visiting <a href="<%= link %>"><%= @site.name %> - <%= @thing.name %> - ACCEPT</a>, or copying the link:

    <p><blockquote>
    <%= link %>
    </blockquote>

    <p><%= @site.footer %>
