type: Rivet.Mailer.Template
values:
  id: A70BC19D-D41F-4C1D-937F-DB4CF0B3945C
  name: Elixir.Core.Mailer.Template.User.Verification
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Email Verification
    === body
    <p>PLEASE NOTE: Libreon, Revenant Creative Studio, and Roguetrader all share the same backend (Codex), as such your account is the same across all of these sites. Changes to one changes it on all.

    <% link = "#{@site.link_api}/ev?code=#{@code}" %><%= if @nfactors == 0 do %>
    <p>A new account was created at <%= @site.name %> with this email address. To complete setup, please verify this email address and add a password by clicking the following link (afterward you can change your email preferences):

    <p><a href="<%= link %>">Verify and setup password</a>.

    <% else %>
    <p>This email address was added to an account at <%= @site.name %>. However, it is not yet verified. Please verify this email address by clicking the link:

    <p><a href="<%= link %>">Verify</a>.

    <% end %>
    <p>This code will expire in <%= @expires %>.

    <%= @site.footer %>

