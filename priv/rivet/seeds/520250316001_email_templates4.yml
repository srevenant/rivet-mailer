---
type: Rivet.Mailer.Template
values:
  id: 599BFAB5-40D3-44AF-9446-D7E002211166
  name: Elixir.Core.Mailer.Template.Invite.MemberAsk
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @site.name %> Access Request
    === body
    <%= @recip.hello %>,
    <p>The following request has been made to "<%= @invite.to %>" at <%= @site.name %>, which you manage:

    <p><blockquote>
    <%= @manage %>
    <div class="border: solid 1px gray; padding: 0.5rem;"><%= @note %></div>
    </blockquote>

    <p>You can go to <a href="<%= @invite.manage_link %>"><%= @site.name %> - <%= @invite.to %> - access management</a> to approve or deny this request.

    <p><%= @site.footer %>

---
type: Rivet.Mailer.Template
values:
  id: C033D498-DCCB-4BCB-9510-9B207C2DD4BA
  name: Elixir.Core.Mailer.Template.Invite.RequestJoin
  data: |-
    === rivet-engram-v1
    sections:
      subject: eex
      body: eex
    === subject
    <%= @admin.name %> has invited you to join "<%= @invite.to %>" at <%= @site.name %>
    === body
    <%= if @recip[:hello] do %><%= @recip.hello %>,<% end %>
    <p><%= @admin.name %> has invited you to join "<%= @invite.to %>" as <%= @access %><%= @roles %>.

    <p>You can accept this invitation by visiting <a href="<%= @invite.link %>"><%= @site.name %> - <%= @invite.to %> - ACCEPT</a>, or copying the link:

    <p><blockquote>
    <%= @invite.link %>
    </blockquote>

    <p><%= @site.footer %>
